<meta charset="utf-8">
<title>הכסף של הטיול</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700;800&family=Overpass:wght@600;800&display=swap">
<style>
  /* layout: one phone-width column; tabs stick to the top; money in tabular Overpass, text in Assistant */
  :root{
    --bg:#EEF1EC; --surface:#FFFFFF; --surface2:#F3F6F1; --line:#D3D9D0; --line2:#B6BEB3;
    --ink:#161A17; --ink2:#48504A; --ink3:#6E766F; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#111418; --surface:#1B1F25; --surface2:#242A32; --line:#323942; --line2:#48505A; --ink:#E9ECE7; --ink2:#AAB1AB; --ink3:#8A928C; color-scheme:dark; } }
  :root[data-theme="dark"]{ --bg:#111418; --surface:#1B1F25; --surface2:#242A32; --line:#323942; --line2:#48505A; --ink:#E9ECE7; --ink2:#AAB1AB; --ink3:#8A928C; color-scheme:dark; }
  [hidden]{display:none!important}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Assistant','Segoe UI',system-ui,sans-serif; direction:rtl; -webkit-text-size-adjust:100%}
  *{box-sizing:border-box}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--ink2); outline-offset:2px}
  .wrap{max-width:600px; margin:0 auto; padding:12px 16px 40px; display:flex; flex-direction:column; gap:10px}
  .wrap > h1{font-family:'Suez One','Assistant',serif; font-weight:400; font-size:26px; margin:0; line-height:1.15}
  .toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 14px); transform:translateX(-50%); background:var(--ink); color:var(--bg); font-size:14px; font-weight:600; padding:8px 16px; border-radius:100px; max-width:calc(100% - 32px); text-align:center; z-index:20}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
__FIN_CSS__
</style>
<div class="wrap"><h1>הכסף של הטיול</h1>
__FIN_HTML__
</div>
<script>
__FIN_JS__
(function(){
  var tt=null;
  function toast(m){ var t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(function(){ t.hidden=true; }, 2800); }
  function download(name, text){
    var p=(window.claude && window.claude.use) ? window.claude.use('downloads') : Promise.resolve(null);
    Promise.resolve(p).catch(function(){ return null; }).then(function(dl){
      if(!dl){ toast('השמירה לא זמינה בתצוגה הזו.'); return; }
      dl.save({filename:name, data:text}).then(function(){ toast('נשמר.'); }, function(e){ if(!(e && e.code==='declined')) toast('השמירה לא הצליחה.'); });
    });
  }
  finInit(document.getElementById('fin'), {claude:true, toast:toast, download:download});
})();
</script>
