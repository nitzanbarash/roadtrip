name: cars
# One-off: open rental car search pages in Chrome and print what they show. Safe to delete.
on:
  workflow_dispatch:
  push:
    paths: [tools/cars/**, .github/workflows/cars.yml]
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/cars
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd tools/cars && npm i --no-save playwright@1.47.2 >/dev/null 2>&1
      - run: cd tools/cars && timeout 1500 node look.js
