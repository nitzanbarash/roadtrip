name: event images
# A picture for every event (Wikipedia: the event, its venue or its town) -> data/new2/event_images.json
on:
  workflow_dispatch:
  push:
    paths: [data/new2/events_*.json, tools/events/event_images.py]
permissions:
  contents: write
concurrency: event-images
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/events
            data/new2
          sparse-checkout-cone-mode: false
      - run: python3 tools/events/event_images.py
      - name: commit if changed
        run: |
          git add data/new2/event_images.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Event pictures"
          git pull --rebase -q && git push
